<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>A Little Something For You</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .container {
            width: 90%;
            max-width: 700px;
            padding: 40px;
        }

        .eyebrow {
            color: #888;
            font-size: 12px;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 20px;
        }

        h1 {
            font-size: clamp(40px, 8vw, 80px);
            margin-bottom: 20px;
        }

        p {
            color: #bbb;
            font-size: 18px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        button {
            background: white;
            color: #111;
            border: none;
            padding: 15px 30px;
            border-radius: 30px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            transform: scale(1.05);
            background: #ff4f81;
            color: white;
        }

        #secret {
            display: none;
            margin-top: 40px;
            animation: fadeIn 1s ease;
        }

        #secret h2 {
            margin-bottom: 15px;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="eyebrow">
            Classified
        </div>

        <h1>Hey, Preety boy.</h1>

        <p>
            If you've somehow found your way here,
            I made you something.
        </p>

        <button onclick="revealSecret()">
            Open
        </button>

        <div id="secret">

            <h2>You found it ❤️</h2>

            <p>
                This is just a tiny test website,
                but eventually this is going to become
                something much more interesting.
            </p>

        </div>

    </div>

    <script>
        function revealSecret() {
            document.getElementById("secret").style.display = "block";
        }
    </script>

</body>
</html>
